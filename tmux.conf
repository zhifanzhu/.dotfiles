unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set-option -g default-shell $SHELL

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# 0 is too far from ` ;)
set -g base-index 1
setw -g pane-base-index 1       # panes start at 1, matching windows
set -g renumber-windows on      # no gaps after closing a window

set-option -g window-status-current-style bg='blue'

# Automatically set window title
set-option -g set-titles on

set -g status-keys vi
set -g history-limit 50000

setw -g mode-keys vi
setw -g monitor-activity on


# Drag-selsection: copy, keep highlight, and stay where the selection is
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-selection-no-clear
# Single click: just clear the highlight (again stay where the selection is)
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X clear-selection
# Allow programs (e.g. agent's copy, vim's yank) to write to clipboard
set -g set-clipboard on
# Allow extended keys differentiated by tmux (e.g. Shift+Enter from Enter)
set -s extended-keys on

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# F1 = toggle like VS Code's Ctrl+J (agent on top, shell at the bottom)
#   zoomed     -> unzoom, jump to the bottom shell
#   not zoomed -> jump to the top pane and zoom it
bind -n F1 if -F '#{window_zoomed_flag}' 'resize-pane -Z ; select-pane -t "{bottom}"' 'select-pane -t "{top}" ; resize-pane -Z'
# prefix + Ctrl+z also zooms (the default "suspend tmux" was easy to hit by accident)
bind C-z resize-pane -Z

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

# THEME
set -g status-bg black
set -g status-fg white
set -g status-interval 60
set -g status-left-length 30
set -g status-left '#[fg=green](#S) #(whoami)'
set -g status-right '#[fg=yellow]#(cut -d " " -f 1-3 /proc/loadavg)#[default] #[fg=white]%H:%M#[default]'
